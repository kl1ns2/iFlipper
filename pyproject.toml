[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iflipper"
version = "0.1.0"
description = "A fast, scriptable companion for Flipper Zero: CLI, TUI, sync, backups, firmware updates and a virtual Flipper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "protobuf>=4.21",
    "pyserial>=3.5",
    "click>=8.1",
    "rich>=13",
    "textual>=0.80",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools"]

[project.scripts]
iflipper = "iflipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
