<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>iFlipper</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><img src="icon.png" alt=""><span>iFlipper</span></div>
      <button id="btn-sound" class="icon-btn" title="Звук">🔊</button>
    </header>
    <div id="status" class="chip"><i></i><span>Запуск…</span></div>

    <section class="hero">
      <button id="btn-custom" class="customize"><span class="spark">✦</span> Customization</button>
      <div id="stage"></div>
      <div id="empty" class="empty">
        <div class="pulse"></div>
        <h1>Подключите Flipper Zero</h1>
        <p>USB-кабелем — iFlipper найдёт его сам</p>
      </div>
    </section>

    <section id="device" class="card">
      <div class="dev-head">
        <div>
          <div id="dev-name" class="dev-name">Нет устройства</div>
          <div id="dev-fw" class="muted">—</div>
        </div>
        <div id="battery" class="battery"><svg viewBox="0 0 44 44"><circle class="track" cx="22" cy="22" r="18"/><circle class="val" cx="22" cy="22" r="18"/></svg><span>—</span></div>
      </div>
      <dl id="dev-meta" class="meta"></dl>
      <div class="bars">
        <div class="bar" id="bar-ext"><label>SD-карта <em></em></label><div><i></i></div></div>
        <div class="bar" id="bar-int"><label>Внутренняя <em></em></label><div><i></i></div></div>
      </div>
      <div id="progress" class="progress hidden"><label></label><div><i></i></div></div>
    </section>

    <section class="actions">
      <button data-act="files" class="needs-dev"><b>📁</b><span>Файлы</span></button>
      <button data-act="shot" class="needs-dev"><b>📸</b><span>Скриншот</span></button>
      <button data-act="alert" class="needs-dev"><b>🔔</b><span>Найти</span></button>
      <button data-act="time" class="needs-dev"><b>🕒</b><span>Время</span></button>
      <button data-act="backup" class="needs-dev"><b>💾</b><span>Бэкап</span></button>
      <button data-act="restore" class="needs-dev"><b>♻️</b><span>Восстановить</span></button>
      <button data-act="update" class="needs-dev wide"><b>⬆️</b><span>Прошивка из .tgz</span></button>
    </section>

    <p class="hint">Нажимайте кнопки на Flipper или <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> <kbd>Enter</kbd> <kbd>Backspace</kbd> · удержание — долгое нажатие</p>
  </main>

  <div class="scrim" data-close></div>

  <aside id="custom" class="drawer">
    <div class="grab"></div>
    <div class="drawer-head">
      <h2>Customization</h2>
      <button class="icon-btn close" data-close>✕</button>
    </div>
    <nav class="tabs" id="custom-tabs"></nav>
    <div class="drawer-body" id="custom-body"></div>
    <div class="drawer-foot">
      <button id="look-reset" class="ghost">Сбросить</button>
      <button id="look-random" class="ghost">🎲 Случайно</button>
    </div>
  </aside>

  <aside id="files" class="drawer">
    <div class="grab"></div>
    <div class="drawer-head">
      <h2>Файлы</h2>
      <button class="icon-btn close" data-close>✕</button>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="file-tools">
      <button id="f-up" class="ghost">⬆ Загрузить</button>
      <button id="f-mkdir" class="ghost">＋ Папка</button>
      <button id="f-refresh" class="ghost">⟳</button>
    </div>
    <ul class="file-list" id="file-list"></ul>
  </aside>

  <div id="toast" class="toast"></div>
  <input type="file" id="picker" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
