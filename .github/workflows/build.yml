name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    env:
      # Optional code signing: add these repository secrets to sign the exe and the installer.
      # SIGN_PFX_BASE64 = base64 of a .pfx code-signing certificate, SIGN_PFX_PASSWORD = its password.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: pyinstaller --noconfirm --clean packaging/iflipper.spec

      - name: Smoke test
        shell: cmd
        run: |
          dist\iFlipper\iflipper-cli.exe --version || exit /b 1
          dist\iFlipper\iflipper-cli.exe --help || exit /b 1
          python -c "import pathlib,sys; p=pathlib.Path('dist/iFlipper/_internal/iflipper/web/js/main.js'); sys.exit(0 if p.exists() else 'web UI missing from the build')"

      - name: Sign executables
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\iFlipper\iFlipper.exe dist\iFlipper\iflipper-cli.exe

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\iFlipper-Setup.exe

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\iFlipper -DestinationPath dist\iFlipper-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: iFlipper-windows
          path: |
            dist/iFlipper-Setup.exe
            dist/iFlipper-portable.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iFlipper-Setup.exe
            dist/iFlipper-portable.zip
